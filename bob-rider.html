<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bob Rider</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:sans-serif}canvas{width:100vw;height:100vh;touch-action:none;background:#fafafa}#u{position:fixed;z-index:2;top:8px;left:8px;display:flex;gap:6px}button{font-size:16px;padding:10px;border:0;border-radius:10px;background:#111;color:#fff}</style><div id=u><button id=d>Draw</button><button id=p>Ride</button><button id=z>Undo</button><button id=c>Clear</button></div><canvas id=x></canvas><script>
const X=x.getContext('2d');let W,H,T=[],cur=null,mode=0,r;function rs(){W=x.width=innerWidth*devicePixelRatio;H=x.height=innerHeight*devicePixelRatio;X.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}onresize=rs;rs();
function pt(e){return{x:e.clientX,y:e.clientY}}x.onpointerdown=e=>{if(mode)return;cur=[pt(e)];T.push(cur);x.setPointerCapture(e.pointerId)};x.onpointermove=e=>{if(!cur)return;let q=pt(e),a=cur.at(-1);if(Math.hypot(q.x-a.x,q.y-a.y)>3)cur.push(q)};x.onpointerup=x.onpointercancel=()=>cur=null;
d.onclick=()=>mode=0;p.onclick=()=>{mode=1;r={x:60,y:100,vx:4,vy:0}};z.onclick=()=>T.pop();c.onclick=()=>T=[];
function hit(px,py,a,b){let vx=b.x-a.x,vy=b.y-a.y,t=((px-a.x)*vx+(py-a.y)*vy)/(vx*vx+vy*vy||1);t=Math.max(0,Math.min(1,t));let qx=a.x+t*vx,qy=a.y+t*vy;return{x:qx,y:qy,d:Math.hypot(px-qx,py-qy),vx,vy}}
function step(){if(!mode||!r)return;r.vy+=.22;let nx=r.x+r.vx,ny=r.y+r.vy,b;for(let P of T)for(let i=0;i<P.length-1;i++){let h=hit(nx,ny,P[i],P[i+1]);if(h.d<10&&(!b||h.d<b.d))b=h}if(b){let L=Math.hypot(b.vx,b.vy)||1,tx=b.vx/L,ty=b.vy/L,s=r.vx*tx+r.vy*ty;r.x=b.x;r.y=b.y-10;r.vx=tx*s*.995;r.vy=ty*s*.995}else{r.x=nx;r.y=ny}if(r.y>innerHeight+50)r=null}
function draw(){X.clearRect(0,0,innerWidth,innerHeight);X.lineCap='round';X.lineJoin='round';X.strokeStyle='#111';X.lineWidth=4;for(let P of T){if(P.length<2)continue;X.beginPath();X.moveTo(P[0].x,P[0].y);for(let q of P)X.lineTo(q.x,q.y);X.stroke()}if(r){X.fillStyle='#1565c0';X.beginPath();X.arc(r.x,r.y,9,0,7);X.fill();X.strokeStyle='#b20';X.beginPath();X.moveTo(r.x-12,r.y+11);X.lineTo(r.x+14,r.y+11);X.stroke()}}
(function loop(){step();draw();requestAnimationFrame(loop)})()
</script>
